<section class="consulting-form">
    <h2 style="text-align: center; color: var(--sky-blue); margin-bottom: 10px;">نموذج استشارة VIP شاملة</h2>
    <p style="text-align: center; color: #888; margin-bottom: 30px;">برجاء ملء البيانات بدقة لتقديم أفضل تحليل عقاري لك</p>

    <form id="consultingForm">
        <h3 style="color: var(--gold); border-bottom: 1px solid #333; padding-bottom: 10px;">1. البيانات الأساسية</h3>
        <div class="form-group">
            <label>الاسم بالكامل</label>
            <input type="text" id="name" placeholder="أدخل اسمك الثلاثي" required>
        </div>
        <div class="form-group">
            <label>رقم الهاتف (واتساب بصيغة الدولة)</label>
            <input type="tel" id="phone" placeholder="مثال: 201065652642" required>
        </div>
        <div class="form-group">
            <label>البريد الإلكتروني</label>
            <input type="email" id="email" placeholder="example@mail.com">
        </div>

        <h3 style="color: var(--gold); border-bottom: 1px solid #333; padding-bottom: 10px; margin-top: 30px;">2. تفاصيل العقار المطلوبة</h3>
        <div class="form-group">
            <label>بصفتك ماذا تطلب الاستشارة؟</label>
            <select id="buyer_type">
                <option value="مشتري فردي">مشتري فردي</option>
                <option value="نيابة عن شركة">نيابة عن شركة (مسؤول مبيعات/إدارة)</option>
                <option value="مستثمر عقاري">مستثمر عقاري محترف</option>
            </select>
        </div>

        <div class="form-group">
            <label>نوع الوحدة المستهدفة:</label>
            <select id="unit_type" required>
                <option value="سكني - سكن رئيسي">وحدة سكنية - سكن رئيسي</option>
                <option value="سكني - سياحي / ساحلي">وحدة سكنية - سياحي / ساحلي</option>
                <option value="إداري - مكاتب">مكاتب إدارية</option>
                <option value="تجاري - محلات">وحدات تجارية / محلات</option>
                <option value="طبي - عيادات">عيادات / وحدات طبية</option>
                <option value="استثمار - إعادة بيع">استثمار بغرض إعادة البيع</option>
                <option value="استثمار - للإيجار">استثمار بغرض الإيجار</option>
            </select>
        </div>

        <div class="form-group">
            <label>المساحة المطلوبة (بالأمتار):</label>
            <input type="number" id="area" placeholder="مثال: 150">
        </div>

        <div class="form-group">
            <label>المنطقة المفضلة:</label>
            <select id="location_pref">
                <option value="مدينة السادات">مدينة السادات</option>
                <option value="القاهرة الجديدة">القاهرة الجديدة</option>
                <option value="العاصمة الإدارية">العاصمة الإدارية</option>
                <option value="الشيخ زايد / أكتوبر">الشيخ زايد / أكتوبر</option>
                <option value="الساحل الشمالي">الساحل الشمالي</option>
                <option value="العين السخنة">العين السخنة</option>
                <option value="أخرى">أخرى / أحتاج اقتراح</option>
            </select>
        </div>

        <h3 style="color: var(--gold); border-bottom: 1px solid #333; padding-bottom: 10px; margin-top: 30px;">3. الميزانية وخطة الدفع</h3>
        <div class="form-group">
            <label>إجمالي الميزانية التقديرية (EGP):</label>
            <select id="budget">
                <option value="3-5 مليون">3 - 5 مليون</option>
                <option value="5-10 مليون">5 - 10 مليون</option>
                <option value="10-20 مليون">10 - 20 مليون</option>
                <option value="أكثر من 20 مليون">أكثر من 20 مليون</option>
                <option value="غير محدد">غير محدد حالياً</option>
            </select>
        </div>

        <div class="form-group">
            <label>المقدم المتاح حالياً (كاش):</label>
            <input type="number" id="down_payment" placeholder="أدخل مبلغ المقدم المتاح">
        </div>

        <div class="form-group">
            <label>طريقة الدفع المفضلة:</label>
            <select id="payment_method">
                <option value="كاش بالكامل">كاش بالكامل (Full Cash)</option>
                <option value="تقسيط">تقسيط (Installments)</option>
                <option value="هجين (مقدم + تقسيط)">هجين (مقدم + تقسيط)</option>
            </select>
        </div>

        <div class="form-group">
            <label>مدة التقسيط المطلوبة (سنوات):</label>
            <select id="installment_years">
                <option value="3 سنوات">3 سنوات</option>
                <option value="5 سنوات">5 سنوات</option>
                <option value="7 سنوات">7 سنوات</option>
                <option value="10 سنوات">10 سنوات</option>
            </select>
        </div>

        <h3 style="color: var(--gold); border-bottom: 1px solid #333; padding-bottom: 10px; margin-top: 30px;">4. تفاصيل إضافية</h3>
        <div class="form-group">
            <label>متى تخطط للشراء؟</label>
            <select id="timeline">
                <option value="خلال أسبوعين">خلال أسبوعين</option>
                <option value="خلال شهر">خلال شهر</option>
                <option value="خلال 3 أشهر">خلال 3 أشهر</option>
                <option value="مجرد بحث حالياً">مجرد بحث حالياً</option>
            </select>
        </div>

        <div class="form-group">
            <label>مواصفات لا غنى عنها (غرف، دور أرضي، إطلالة.. إلخ):</label>
            <textarea id="requirements" style="width:100%; padding:14px; border-radius:10px; background:#000; color:#fff; border:1px solid #333; font-family:'Cairo';" rows="3"></textarea>
        </div>

        <button type="submit" class="submit-btn">إرسال الاستمارة للواتساب <i class="fab fa-whatsapp"></i></button>
    </form>
</section>

<script>
    document.getElementById('consultingForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        // تجميع كل البيانات
        const data = {
            name: document.getElementById('name').value,
            phone: document.getElementById('phone').value,
            email: document.getElementById('email').value,
            buyerType: document.getElementById('buyer_type').value,
            unitType: document.getElementById('unit_type').value,
            area: document.getElementById('area').value,
            location: document.getElementById('location_pref').value,
            budget: document.getElementById('budget').value,
            downPayment: document.getElementById('down_payment').value,
            payMethod: document.getElementById('payment_method').value,
            years: document.getElementById('installment_years').value,
            timeline: document.getElementById('timeline').value,
            reqs: document.getElementById('requirements').value
        };

        const myNumber = "201065652642"; 
        
        // تنسيق الرسالة لتصلك منظمة جداً
        const message = `🏛️ *استمارة استشارة VIP جديدة*%0A` +
                        `--------------------------------%0A` +
                        `👤 *العميل:* ${data.name}%0A` +
                        `📞 *الهاتف:* ${data.phone}%0A` +
                        `📧 *البريد:* ${data.email}%0A%0A` +
                        `🏢 *نوع الوحدة:* ${data.unitType}%0A` +
                        `📐 *المساحة:* ${data.area} متر%0A` +
                        `📍 *المنطقة:* ${data.location}%0A%0A` +
                        `💰 *الميزانية:* ${data.budget}%0A` +
                        `💵 *المقدم:* ${data.downPayment} ج.م%0A` +
                        `💳 *النظام:* ${data.payMethod}%0A` +
                        `🗓️ *مدة التقسيط:* ${data.years}%0A%0A` +
                        `⏳ *موعد الشراء:* ${data.timeline}%0A` +
                        `📝 *ملاحظات:* ${data.reqs}%0A` +
                        `--------------------------------%0A` +
                        `✅ تم الإرسال من Hossam Gmeay Academy`;

        window.open(`https://wa.me/${myNumber}?text=${message}`, '_blank');
    });
</script>
