<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hossam Gmeay | الاستشاري العقاري والخبير البيعي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --sky-blue: #00d2ff;
            --deep-black: #050505;
            --gold: #c5a059;
            --card-bg: #111;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--deep-black);
            color: #fff;
            margin: 0; padding: 0;
            line-height: 1.6;
        }

        /* Header Section */
        header {
            text-align: center;
            padding: 80px 20px;
            background: linear-gradient(180deg, #111 0%, #050505 100%);
            border-bottom: 1px solid #222;
        }

        h1 { font-size: 3rem; margin: 10px 0; color: var(--sky-blue); font-weight: 900; }
        
        .experience-badge {
            background: var(--gold);
            color: #000;
            padding: 8px 25px;
            border-radius: 30px;
            font-weight: 900;
            display: inline-block;
            font-size: 1.2rem;
            margin-top: 15px;
        }

        /* Brand Cards */
        .brand-section {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            padding: 40px 20px;
        }

        .brand-card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 15px;
            border: 1px solid #222;
            text-align: center;
            width: 280px;
        }

        .brand-card i { font-size: 2.2rem; color: var(--sky-blue); margin-bottom: 15px; }

        /* Form Styling */
        .consulting-form {
            max-width: 700px;
            margin: 0 auto 60px;
            background: #0f0f0f;
            padding: 40px;
            border-radius: 20px;
            border: 1px solid #222;
            box-shadow: 0 15px 50px rgba(0,0,0,0.8);
        }

        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: var(--gold); font-weight: 700; }
        
        input, select {
            width: 100%; padding: 14px; border-radius: 10px; border: 1px solid #333;
            background: #000; color: #fff; font-family: 'Cairo'; font-size: 1rem;
            box-sizing: border-box;
        }

        .submit-btn {
            width: 100%; padding: 20px; border: none; border-radius: 12px;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            color: #000; font-weight: 900; font-size: 1.3rem; cursor: pointer;
            transition: 0.4s;
        }

        .submit-btn:hover { transform: scale(1.02); box-shadow: 0 5px 25px rgba(0, 210, 255, 0.4); }

        footer { text-align: center; padding: 40px; color: #444; border-top: 1px solid #111; }
    </style>
</head>
<body>

    <header>
        <h1>حسام جميعي</h1>
        <div class="experience-badge">19 عاماً من الخبرة في مجال المبيعات</div>
        <p style="max-width: 700px; margin: 25px auto; color: #ccc;">
            خبير استراتيجي في إدارة المبيعات والاستشارات العقارية. <br>
            تحت إدارة <b>Hossam Gmeay Academy</b>
        </p>
    </header>

    <div class="brand-section">
        <div class="brand-card">
            <i class="fas fa-crown"></i>
            <h3>Power Land Property</h3>
            <p>السيادة في السوق العقاري</p>
        </div>
        <div class="brand-card">
            <i class="fas fa-rocket"></i>
            <h3>The Millionaire Club</h3>
            <p>مجتمع صناعة النجاح</p>
        </div>
    </div>

    <section class="consulting-form">
        <h2 style="text-align: center; color: var(--sky-blue); margin-bottom: 30px;">طلب استشارة VIP</h2>

        <form id="consultingForm">
            <div class="form-group">
                <label>الاسم بالكامل</label>
                <input type="text" id="name" placeholder="أدخل اسمك بالكامل" required>
            </div>
            
            <div class="form-group">
                <label>رقم الهاتف</label>
                <input type="tel" id="phone" placeholder="رقم الواتساب" required>
            </div>

            <div class="form-group">
                <label>نوع الاستشارة (مصفوفة الوحدات):</label>
                <select id="unit_type" required>
                    <option value="" disabled selected>اختر نوع الوحدة...</option>
                    <option value="سكني - سكن رئيسي">وحدة سكنية - سكن رئيسي</option>
                    <option value="سكني - سياحي">وحدة سكنية - سياحي / ساحلي</option>
                    <option value="إداري - مكاتب">مكاتب إدارية</option>
                    <option value="تجاري - محلات">وحدات تجارية / محلات</option>
                    <option value="طبي - عيادات">عيادات / وحدات طبية</option>
                    <option value="استثماري - إعادة بيع">استثمار بغرض إعادة البيع</option>
                    <option value="أخرى">استشارة عامة</option>
                </select>
            </div>

            <div class="form-group">
                <label>الميزانية التقديرية (EGP):</label>
                <select id="budget">
                    <option value="3-5 مليون">3 - 5 مليون</option>
                    <option value="5-10 مليون">5 - 10 مليون</option>
                    <option value="أكثر من 20 مليون">أكثر من 20 مليون</option>
                    <option value="غير محدد">غير محدد حالياً</option>
                </select>
            </div>

            <div class="form-group">
                <label>المنطقة المفضلة:</label>
                <select id="location_pref">
                    <option value="" disabled selected>اختر المنطقة...</option>
                    <option value="مدينة السادات">مدينة السادات</option>
                    <option value="القاهرة الجديدة">القاهرة الجديدة</option>
                    <option value="العاصمة الإدارية">العاصمة الإدارية</option>
                    <option value="الشيخ زايد / أكتوبر">الشيخ زايد / أكتوبر</option>
                    <option value="الساحل الشمالي / السخنة">الساحل الشمالي / السخنة</option>
                    <option value="أخرى">أماكن أخرى</option>
                </select>
            </div>

            <button type="submit" class="submit-btn">إرسال البيانات للواتساب <i class="fab fa-whatsapp"></i></button>
        </form>
    </section>

    <footer>
        <p>© 2026 Hossam Gmeay Academy | ثقة في الله نجاح</p>
    </footer>

    <script>
        document.getElementById('consultingForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;
            const unitType = document.getElementById('unit_type').value;
            const budget = document.getElementById('budget').value;
            const location = document.getElementById('location_pref').value;
            
            // الرقم الخاص بك لاستقبال الطلبات
            const myNumber = "201065652642"; 
            
            const message = `🏛️ *طلب استشارة VIP جديدة*%0A` +
                            `--------------------------------%0A` +
                            `👤 *الاسم:* ${name}%0A` +
                            `📞 *الهاتف:* ${phone}%0A` +
                            `🏘️ *نوع الوحدة:* ${unitType}%0A` +
                            `💰 *الميزانية:* ${budget}%0A` +
                            `📍 *المنطقة:* ${location}%0A` +
                            `--------------------------------%0A` +
                            `✅ تم الإرسال عبر سيستم حسام جميعي`;

            window.open(`https://wa.me/${myNumber}?text=${message}`, '_blank');
        });
    </script>
</body>
</html>
